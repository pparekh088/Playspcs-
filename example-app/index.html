<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme — Login</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    label { display: block; margin-bottom: 4px; font-size: .875rem; font-weight: 500; }
    input { width: 100%; padding: 8px 12px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #1d4ed8; }
    #error-message { display: none; color: #dc2626; font-size: .875rem; margin-bottom: 12px; }
    #error-message.visible { display: block; }
  </style>
</head>
<body>
  <h1>Sign in to Acme</h1>
  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" data-testid="email" placeholder="you@example.com" autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" data-testid="password" placeholder="••••••••" autocomplete="current-password">

    <div id="error-message" data-testid="error-message" role="alert">Invalid email or password.</div>

    <button type="submit" data-testid="submit-button">Sign in</button>
  </form>

  <script>
    const VALID = { email: 'user@example.com', password: 'password123' };

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('error-message');

      if (email === VALID.email && password === VALID.password) {
        window.location.href = 'dashboard.html';
      } else {
        err.classList.add('visible');
        err.textContent = 'Invalid email or password.';
      }
    });
  </script>
</body>
</html>
